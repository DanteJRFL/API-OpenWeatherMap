<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Previsão do Tempo</title>
</head>
<body>

            <H2 id="nome-cidade"></H2>

            <div class="box-small">
                <h2 id="previsao"></h2>
                <img src="./assets/sun.png" alt="img-icon" id="img-icon">
            </div>
            <H2 id="umidade"></H2>
            <H2 id="vento"></H2>
        </div>
    </main>
</body>
</html>
